<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Latihan Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }

        .btn {
            display: block;
            padding: 15px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Menu Utama Latihan</h1>

    <div class="menu-container">
        <a href="lat1/index.html" class="btn">Latihan 1</a>
        <a href="lat2/index.html" class="btn">Latihan 2</a>
        <a href="lat3/index.html" class="btn">Latihan 3</a>
        <a href="lat4/index.html" class="btn">Latihan 4</a>
    </div>

</body>
</html>
